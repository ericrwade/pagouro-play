# iPhone build check (2026-10-06): exports the game as an Xcode project with Godot 4.7.2 on a macOS runner and
# compiles it for the iOS Simulator, unsigned. Proves the game builds for iPhone without a Mac or an Apple account.
# Signing and App Store upload come later (they need the Apple Developer Program).
name: iOS build check

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Get Godot and the export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          dest="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$dest/"
          ls "$dest" | grep -i ios

      - name: Import and export the Xcode project
        run: |
          GODOT="$PWD/Godot.app/Contents/MacOS/Godot"
          "$GODOT" --headless --path jigsaw --import || true
          mkdir -p build/ios
          "$GODOT" --headless --path jigsaw --export-release "iOS" ../build/ios/PagouroJigsaw.xcodeproj 2>&1 | tee export.log
          ls build/ios

      - name: Compile for the iOS Simulator (unsigned)
        run: |
          cd build/ios
          xcodebuild -project PagouroJigsaw.xcodeproj -scheme PagouroJigsaw -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tail -40
          test "${PIPESTATUS[0]}" -eq 0

# iPhone build (2026-10-06, signing 2026-10-08): exports the game as an Xcode project with Godot 4.7.2 on a macOS
# runner and builds it for a real iPhone (arm64). No Mac needed.
#   upload = false: unsigned compile check (no Apple account involved).
#   upload = true:  archive signed by Apple's cloud-managed signing via the App Store Connect API key (repo secrets
#                   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8; no certificate or password is stored anywhere) and upload
#                   the build to App Store Connect for TestFlight.
name: iOS build

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Sign and upload to TestFlight"
        type: boolean
        default: false

jobs:
  ios:
    runs-on: macos-26  # Godot 4.7 templates are built against the iOS 26 SDK (Xcode 26)
    timeout-minutes: 60
    env:
      GODOT_VERSION: 4.7.2
      TEAM_ID: 4V5P7JZ6RM  # public: printed inside every app the team ships
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Get Godot and the export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          dest="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$dest/"
          ls "$dest" | grep -i ios

      - name: Import and export the Xcode project
        run: |
          GODOT="$PWD/Godot.app/Contents/MacOS/Godot"
          "$GODOT" --headless --path jigsaw --import || true
          mkdir -p build/ios
          "$GODOT" --headless --path jigsaw --export-release "iOS" ../build/ios/PagouroJigsaw.xcodeproj 2>&1 | tee export.log
          ls build/ios

      # A real iPhone (arm64), unsigned. Godot's Simulator library is x86_64 only, so the Simulator is not the check.
      - name: Compile for iPhone (unsigned)
        if: ${{ !inputs.upload }}
        run: |
          cd build/ios
          xcodebuild -project PagouroJigsaw.xcodeproj -scheme PagouroJigsaw -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tail -40
          test "${PIPESTATUS[0]}" -eq 0

      - name: Archive, sign and upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -o pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          cd build/ios
          xcodebuild -project PagouroJigsaw.xcodeproj -scheme PagouroJigsaw -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Jigsaw.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tail -60
          # archived unsigned: a development signature would need a registered iPhone, and automatic signing refuses a
          # manual Distribution identity. The export below signs for the App Store with Apple's cloud-managed certificate.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Jigsaw.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${auth[@]}" 2>&1 | tail -60
          rm -f "$key"
